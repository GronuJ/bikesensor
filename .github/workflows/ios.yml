# Builds the iPhone app on a GitHub macOS runner, unsigned, so a change that
# does not compile shows up here instead of on the Mac it is installed from.
name: ios

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iPhone, unsigned
        run: |
          xcodebuild build \
            -project ios/KielEarth.xcodeproj \
            -scheme KielEarth \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
